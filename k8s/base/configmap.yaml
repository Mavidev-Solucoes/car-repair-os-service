apiVersion: v1
kind: ConfigMap
metadata:
  name: car-repair-os-service-config
  labels:
    app.kubernetes.io/name: car-repair-os-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: car-repair
# Só configuração não sigilosa. Senhas vêm dos Secrets criados por
# car-repair-k8s-infra/scripts/academy-bootstrap-platform.sh.
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  RabbitMq__Enabled: "true"
  RabbitMq__HostName: "rabbitmq"
  HttpsRedirection__Enabled: "false"
  # New Relic APM (agente .NET na imagem). A license vem do Secret newrelic-license;
  # sem ele o agente fica sem enviar dados e o serviço segue normal.
  CORECLR_ENABLE_PROFILING: "1"
  NEW_RELIC_APP_NAME: "car-repair-os-service"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_LABELS: "project:car-repair-shop;phase:4;service:os-service"
  # Swagger UI em /swagger (acesso por kubectl port-forward; o Kong só roteia /api/...).
  Swagger__Enabled: "true"
