name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_PATH: CarRepairOsService.sln
  COVERAGE_THRESHOLD: 80
  SONAR_HOST_URL: https://sonarcloud.io

jobs:
  quality:
    name: 1-4 Restore, Build, Test, Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add .NET global tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: 1. Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: 2. Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: 3. Unit Tests
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            /p:CollectCoverage=true \
            '/p:CoverletOutput=${{ github.workspace }}/TestResults/Coverage/$(MSBuildProjectName)/' \
            /p:CoverletOutputFormat="opencover,cobertura"

      - name: 4. Generate Code Coverage Report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/Coverage/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"Cobertura;TextSummary"

      - name: 4. Enforce minimum coverage (80%)
        run: |
          if [ ! -f "TestResults/CoverageReport/Cobertura.xml" ]; then
            echo "Coverage report not found at TestResults/CoverageReport/Cobertura.xml"
            exit 1
          fi

          python3 - <<'PY'
import os
import xml.etree.ElementTree as ET

threshold = float(os.environ["COVERAGE_THRESHOLD"])
report_path = "TestResults/CoverageReport/Cobertura.xml"

line_rate = float(ET.parse(report_path).getroot().attrib.get("line-rate", 0.0))
coverage = line_rate * 100

print(f"Computed line coverage: {coverage:.2f}%")
if coverage < threshold:
    raise SystemExit(f"Coverage {coverage:.2f}% is below threshold {threshold:.2f}%")
PY

  sonar:
    name: 5. SonarQube Analysis
    runs-on: ubuntu-latest
    needs: quality
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

    steps:
      - name: Determine SonarCloud execution mode
        id: sonar_mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          if [ -n "${SONAR_TOKEN}" ] && [ -n "${SONAR_PROJECT_KEY}" ] && [ -n "${SONAR_ORGANIZATION}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${IS_FORK_PR}" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SonarCloud for fork pull request without secrets."
            exit 0
          fi

          echo "Missing SONAR_TOKEN, SONAR_PROJECT_KEY, or SONAR_ORGANIZATION secret."
          exit 1

      - name: Checkout
        if: steps.sonar_mode.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        if: steps.sonar_mode.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add .NET global tools to PATH
        if: steps.sonar_mode.outputs.run == 'true'
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore for Sonar analysis
        if: steps.sonar_mode.outputs.run == 'true'
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: SonarQube Analysis (begin)
        if: steps.sonar_mode.outputs.run == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner
          ~/.dotnet/tools/dotnet-sonarscanner begin \
            /k:"${SONAR_PROJECT_KEY}" \
            /o:"${SONAR_ORGANIZATION}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="${{ env.SONAR_HOST_URL }}" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"

      - name: Build for Sonar analysis
        if: steps.sonar_mode.outputs.run == 'true'
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test for Sonar analysis
        if: steps.sonar_mode.outputs.run == 'true'
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            /p:CollectCoverage=true \
            '/p:CoverletOutput=${{ github.workspace }}/TestResults/Coverage/$(MSBuildProjectName)/' \
            /p:CoverletOutputFormat="opencover"

      - name: SonarQube Analysis (quality gate)
        if: steps.sonar_mode.outputs.run == 'true'
        run: ~/.dotnet/tools/dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  docker-validation:
    name: 6. Docker Build Validation
    runs-on: ubuntu-latest
    needs:
      - quality
      - sonar
    if: ${{ always() && needs.quality.result == 'success' && needs.sonar.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build --file src/Api/Dockerfile --tag car-repair-os-service:ci .
